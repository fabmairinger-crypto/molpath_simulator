<text x="586" y="548" text-anchor="middle" class="t b med red">Intron 19</text><text x="586" y="580" text-anchor="middle" class="t b med red">keine / sehr geringe Target-Abdeckung</text>
<text x="586" y="840" text-anchor="middle" class="t b med red">≈3,2 kb struktureller Blindbereich</text>
<!-- target bars -->
<text x="60" y="870" class="t b small h">Target-Design</text><g fill="#164f97"><rect x="130" y="856" width="110" height="15"/><rect x="260" y="856" width="105" height="15"/><rect x="382" y="856" width="65" height="15"/><rect x="735" y="856" width="100" height="15"/><rect x="850" y="856" width="110" height="15"/><rect x="975" y="856" width="95" height="15"/></g>
<!-- interpretation right -->
<text x="1190" y="322" class="t b lg h">Interpretation</text>
<text x="1190" y="370" class="t med">Der Lauf ist global technisch valide.</text>
<text x="1190" y="410" class="t med">Der für ALK-Rearrangements relevante</text><text x="1190" y="442" class="t med">intronische Bereich ist jedoch nicht</text><text x="1190" y="474" class="t med">vollständig im Target-Design enthalten.</text>
<rect x="1185" y="515" width="295" height="165" rx="10" class="warn"/><text x="1205" y="553" class="t b med red">Methodische Konsequenz</text><text x="1205" y="592" class="t med">Ein negativer DNA-Fusionscall</text><text x="1205" y="624" class="t med">schließt ein ALK-Rearrangement</text><text x="1205" y="656" class="t med b">nicht sicher aus.</text>
<rect x="1185" y="705" width="295" height="160" rx="10" fill="#eff8f1" stroke="#9cc7a8" stroke-width="2"/><text x="1205" y="743" class="t b med green">Empfehlung</text><text x="1205" y="782" class="t med">Bei hoher Prätestwahrscheinlichkeit:</text><text x="1205" y="816" class="t med b">RNA-basierte Fusionsanalyse</text><text x="1205" y="848" class="t med">und/oder orthogonaler FISH-Assay.</text>
<text x="35" y="975" class="t small mut">Synthetisches Trainingsasset · Schwerpunkt: Assaydesign und intronische Fusionsabdeckung · keine realen Patientendaten</text>
</svg>
