<path d="M110 790 L110 625 L145 600 L180 585 L215 610 L250 575 L285 590 L320 605 L355 590 L390 610 L425 598 L455 780 L485 786 L515 783 L545 789 L575 784 L605 786 L635 782 L665 788 L695 790 L725 635 L760 620 L795 605 L830 615 L865 595 L900 610 L935 600 L970 620 L1005 605 L1040 610 L1080 620 L1080 790 Z" fill="#c8cdd2"/>
