<style>
.t{font-family:Arial,Helvetica,sans-serif;fill:#172033}.b{font-weight:700}.h{fill:#0d3568}.blue{fill:#164f97}.mut{fill:#6b7788}.red{fill:#c92828}.green{fill:#1d7d43}.small{font-size:19px}.med{font-size:23px}.lg{font-size:35px}.xl{font-size:43px}.box{fill:#fff;stroke:#b9c8d8;stroke-width:2}.panel{fill:#f7fafc;stroke:#c6d3e0;stroke-width:2}.warn{fill:#fff6eb;stroke:#efb36f;stroke-width:2}
