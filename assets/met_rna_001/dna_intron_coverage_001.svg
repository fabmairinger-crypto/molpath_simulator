<text x="768" y="58" text-anchor="middle" class="t b xl">DNA-NGS – Target Coverage</text><text x="768" y="92" text-anchor="middle" class="t med blue">ALK-Lokus · technische Aussagegrenze der Fusionsdetektion</text>
<rect x="1185" y="22" width="315" height="92" rx="10" class="box"/><text x="1206" y="52" class="t b small">Fall-ID:</text><text x="1300" y="52" class="t small">MET_RNA_001</text><text x="1206" y="82" class="t b small">Material:</text><text x="1300" y="82" class="t small">FFPE Lungenbiopsie</text>
<line x1="35" y1="128" x2="1500" y2="128" stroke="#0d3568" stroke-width="4"/>
<!-- metadata -->
<rect x="35" y="150" width="1465" height="108" rx="10" class="panel"/>
<text x="60" y="186" class="t b med h">Assay</text><text x="180" y="186" class="t med">DNA-basiertes Targeted NGS · Onkologiepanel</text>
<text x="60" y="225" class="t b med h">Gesamt-QC</text><text x="180" y="225" class="t med green">bestanden · mittlere Target-Coverage 812× · 99,1 % der Zielregionen ≥100×</text>
<text x="850" y="186" class="t b med h">Fragestellung</text><text x="1030" y="186" class="t med">Kann ein negatives DNA-Ergebnis ALK-Rearrangement ausschließen?</text>
<text x="850" y="225" class="t b med h">Antwort</text><text x="1030" y="225" class="t med red">Nein – intronischer Breakpointbereich unzureichend erfasst.</text>
<!-- locus -->
<rect x="35" y="280" width="1110" height="620" rx="12" class="box"/><rect x="1165" y="280" width="335" height="620" rx="12" class="box"/>
<text x="60" y="320" class="t b lg h">ALK (2p23.2) – Coverage über relevante Zielbereiche</text>
<text x="60" y="352" class="t small mut">Schematische technische Darstellung; kein patientenspezifischer Browser-Screenshot</text>
