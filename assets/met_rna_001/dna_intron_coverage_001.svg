<line x1="110" y1="420" x2="1080" y2="420" stroke="#173d72" stroke-width="4"/>
<g fill="#173d72"><rect x="145" y="401" width="34" height="38"/><rect x="235" y="405" width="18" height="30"/><rect x="300" y="405" width="18" height="30"/><rect x="365" y="405" width="18" height="30"/><rect x="435" y="401" width="34" height="38"/><rect x="530" y="405" width="18" height="30"/><rect x="605" y="401" width="34" height="38"/><rect x="700" y="405" width="18" height="30"/><rect x="780" y="401" width="34" height="38"/><rect x="890" y="405" width="18" height="30"/><rect x="995" y="401" width="34" height="38"/></g>
